<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" rx="10" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">CW Paddle adapter wiring (jack A)</text>

  <!-- Pico -->
  <rect x="40" y="70" width="230" height="230" rx="8" fill="#1b7a3a"/>
  <rect x="120" y="56" width="70" height="22" rx="3" fill="#b9b9b9"/>
  <text x="155" y="72" text-anchor="middle" font-size="12" fill="#111">USB</text>
  <text x="155" y="285" text-anchor="middle" font-size="16" fill="#fff">Raspberry Pi Pico 2</text>
  <text x="155" y="265" text-anchor="middle" font-size="12" fill="#d8f5e0">(header pins 3, 4, 5)</text>
  <g font-size="14" fill="#fff">
    <circle cx="255" cy="120" r="7" fill="#f2c94c"/><text x="240" y="125" text-anchor="end">pin 3  GND</text>
    <circle cx="255" cy="160" r="7" fill="#f2c94c"/><text x="240" y="165" text-anchor="end">pin 4  GP2</text>
    <circle cx="255" cy="200" r="7" fill="#f2c94c"/><text x="240" y="205" text-anchor="end">pin 5  GP3</text>
  </g>

  <!-- wires -->
  <g stroke-width="4" fill="none">
    <path d="M262 120 H420 V250 H520" stroke="#222"/>
    <path d="M262 160 H460 V210 H520" stroke="#2d6cdf"/>
    <path d="M262 200 H440 V170 H520" stroke="#d94141"/>
  </g>

  <!-- TRS jack -->
  <rect x="520" y="140" width="190" height="130" rx="8" fill="#eee" stroke="#999"/>
  <text x="615" y="128" text-anchor="middle" font-size="15" fill="#111">3.5 mm stereo (TRS) jack</text>
  <g font-size="14" fill="#111">
    <circle cx="520" cy="170" r="7" fill="#d94141"/><text x="535" y="175">Tip = DIT</text>
    <circle cx="520" cy="210" r="7" fill="#2d6cdf"/><text x="535" y="215">Ring = DAH</text>
    <circle cx="520" cy="250" r="7" fill="#222"/><text x="535" y="255">Sleeve = common</text>
  </g>
  <text x="380" y="325" text-anchor="middle" font-size="13" fill="#555">No resistors: the Pico's internal pull-ups hold each pin high; a closed lever pulls it to ground.</text>
</svg>
